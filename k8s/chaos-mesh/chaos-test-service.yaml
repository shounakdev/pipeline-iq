apiVersion: apps/v1
kind: Deployment
metadata:
  name: chaos-test-service
  namespace: platformiq-dev
  labels:
    app.kubernetes.io/name: chaos-test-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: chaos-test-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: chaos-test-service
    spec:
      containers:
        - name: http
          image: registry.k8s.io/e2e-test-images/agnhost:2.53
          args: ["netexec", "--http-port=8080"]
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 2
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: chaos-test-service
  namespace: platformiq-dev
spec:
  selector:
    app.kubernetes.io/name: chaos-test-service
  ports:
    - name: http
      port: 80
      targetPort: http
