server:
  port: 8080

spring:
  application:
    name: inventory-service

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: inventory-service
  distribution:
    percentiles-histogram:
      http.server.requests: true