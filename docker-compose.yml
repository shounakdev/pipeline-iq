services:
  postgres:
    image: postgres:16
    container_name: cicd_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cicd_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: cicd_redis
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
    env_file:
      - .env
    container_name: cicd_backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/cicd_db
      REDIS_URL: redis://redis:6379/0
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      SONARQUBE_URL: ${SONARQUBE_URL:-http://sonarqube:9000}
      SONARQUBE_HOST_URL: ${SONARQUBE_URL:-http://sonarqube:9000}
      SONARQUBE_BROWSER_URL: ${SONARQUBE_BROWSER_URL:-http://localhost:9000}
      SONARQUBE_TOKEN: ${SONARQUBE_TOKEN:-}
      SONARQUBE_PROJECT_KEY: ${SONARQUBE_PROJECT_KEY:-cicd-demo}
    depends_on:
      - postgres
      - redis
      - sonarqube

  worker:
    build:
      context: ./backend
    env_file:
      - .env
    container_name: cicd_worker
    command: celery -A app.celery_app.celery_app worker --loglevel=info -Q pipeline_queue
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/cicd_db
      REDIS_URL: redis://redis:6379/0
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      SONARQUBE_URL: ${SONARQUBE_URL:-http://sonarqube:9000}
      SONARQUBE_HOST_URL: ${SONARQUBE_URL:-http://sonarqube:9000}
      SONARQUBE_BROWSER_URL: ${SONARQUBE_BROWSER_URL:-http://localhost:9000}
      SONARQUBE_TOKEN: ${SONARQUBE_TOKEN:-}
      SONARQUBE_PROJECT_KEY: ${SONARQUBE_PROJECT_KEY:-cicd-demo}
    depends_on:
      - postgres
      - redis
      - backend
      - sonarqube

  sonarqube_db:
    image: postgres:16
    container_name: cicd_sonarqube_db
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar
      POSTGRES_DB: sonarqube
    volumes:
      - sonarqube_db_data:/var/lib/postgresql/data

  sonarqube:
    image: sonarqube:lts-community
    container_name: cicd_sonarqube
    depends_on:
      - sonarqube_db
    ports:
      - "9000:9000"
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonarqube_db:5432/sonarqube
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs

volumes:
  postgres_data:
  sonarqube_db_data:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs: