services:
  postgres:
    image: postgres:16
    container_name: cicd_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cicd_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - platformiq-net

  platformiq-kafka:
    image: apache/kafka:4.1.2
    container_name: platformiq-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://platformiq-kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@platformiq-kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    networks:
      - platformiq-net

  platformiq-kafka-init:
    image: apache/kafka:4.1.2
    container_name: platformiq-kafka-init
    depends_on:
      platformiq-kafka:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -ec
      - |
        echo "Waiting for Kafka..."

        until /opt/kafka/bin/kafka-topics.sh --bootstrap-server platformiq-kafka:9092 --list >/dev/null 2>&1; do
          echo "Kafka not ready yet..."
          sleep 3
        done

        echo "Creating Kafka topics..."

        /opt/kafka/bin/kafka-topics.sh --bootstrap-server platformiq-kafka:9092 --create --if-not-exists --topic pipeline.events --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server platformiq-kafka:9092 --create --if-not-exists --topic deployment.events --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server platformiq-kafka:9092 --create --if-not-exists --topic kubernetes.events --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server platformiq-kafka:9092 --create --if-not-exists --topic telemetry.alerts --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server platformiq-kafka:9092 --create --if-not-exists --topic incident.events --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server platformiq-kafka:9092 --create --if-not-exists --topic remediation.commands --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server platformiq-kafka:9092 --create --if-not-exists --topic remediation.results --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server platformiq-kafka:9092 --create --if-not-exists --topic audit.events --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server platformiq-kafka:9092 --create --if-not-exists --topic dead-letter.events --partitions 3 --replication-factor 1

        echo "Kafka topics ready."
    networks:
      - platformiq-net

  platformiq-kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: platformiq-kafka-ui
    depends_on:
      platformiq-kafka:
        condition: service_healthy
    ports:
      - "8085:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: platformiq-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: platformiq-kafka:9092
      DYNAMIC_CONFIG_ENABLED: "true"
    networks:
      - platformiq-net

  redis:
    image: redis:7
    container_name: cicd_redis
    ports:
      - "6380:6379"
    networks:
      - platformiq-net

  backend:
    build:
      context: ./backend
    env_file:
      - .env
    container_name: cicd_backend
    ports:
      - "8000:8000"
    environment:
      KUBECONFIG: /root/.kube/config
      KUBERNETES_NAMESPACE: platformiq-demo
      PLATFORMIQ_ENVIRONMENT: staging

      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/cicd_db
      REDIS_URL: redis://redis:6379/0

      KAFKA_BOOTSTRAP_SERVERS: platformiq-kafka:9092
      KAFKA_CONSUMER_GROUP_ID: platformiq-event-consumers
      KAFKA_CONSUMER_TOPICS: pipeline.events,deployment.events,kubernetes.events,audit.events,telemetry.alerts
      KAFKA_CONSUMER_BATCH_SIZE: 25
      DEAD_LETTER_TOPIC: dead-letter.events
      KAFKA_CLIENT_ID: platformiq-backend

      CELERY_BROKER_URL: redis://redis:6379/0
      PGSSLMODE: disable

      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}

      SONARQUBE_URL: http://sonarqube:9000
      SONARQUBE_HOST_URL: http://sonarqube:9000
      SONARQUBE_BROWSER_URL: http://localhost:9000
      SONARQUBE_TOKEN: ${SONARQUBE_TOKEN:-}
      SONARQUBE_PROJECT_KEY: ${SONARQUBE_PROJECT_KEY:-cicd-demo}
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_started
      sonarqube:
        condition: service_started
      platformiq-kafka:
        condition: service_healthy
      platformiq-kafka-init:
        condition: service_completed_successfully
    volumes:
      - ./kubeconfig-docker.yaml:/root/.kube/config:ro
    networks:
      - platformiq-net
      - kind

  worker:
    build:
      context: ./backend
    env_file:
      - .env
    container_name: cicd_worker
    command: >
      celery
      -A app.celery_app:celery_app
      worker
      --loglevel=INFO
      --queues=pipeline_queue
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/cicd_db
      REDIS_URL: redis://redis:6379/0

      KUBECONFIG: /root/.kube/config
      KUBERNETES_NAMESPACE: platformiq-demo
      PLATFORMIQ_ENVIRONMENT: staging

      KAFKA_BOOTSTRAP_SERVERS: platformiq-kafka:9092
      KAFKA_CLIENT_ID: platformiq-worker

      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}

      PGSSLMODE: disable
      CELERY_BROKER_URL: redis://redis:6379/0

      SONARQUBE_URL: http://sonarqube:9000
      SONARQUBE_HOST_URL: http://sonarqube:9000
      SONARQUBE_BROWSER_URL: http://localhost:9000
      SONARQUBE_TOKEN: ${SONARQUBE_TOKEN:-}
      SONARQUBE_PROJECT_KEY: ${SONARQUBE_PROJECT_KEY:-cicd-demo}
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_started
      backend:
        condition: service_started
      sonarqube:
        condition: service_started
      platformiq-kafka:
        condition: service_healthy
      platformiq-kafka-init:
        condition: service_completed_successfully
    volumes:
      - ./kubeconfig-docker.yaml:/root/.kube/config:ro
    networks:
      - platformiq-net
      - kind

  platformiq-celery-beat:
    build:
      context: ./backend
    env_file:
      - .env
    container_name: platformiq-celery-beat
    command: >
      celery
      -A app.celery_app:celery_app
      beat
      --loglevel=INFO
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/cicd_db
      REDIS_URL: redis://redis:6379/0

      KAFKA_BOOTSTRAP_SERVERS: platformiq-kafka:9092
      KAFKA_CLIENT_ID: platformiq-celery-beat

      CELERY_BROKER_URL: redis://redis:6379/0
      PGSSLMODE: disable

      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}

      SONARQUBE_URL: http://sonarqube:9000
      SONARQUBE_HOST_URL: http://sonarqube:9000
      SONARQUBE_BROWSER_URL: http://localhost:9000
      SONARQUBE_TOKEN: ${SONARQUBE_TOKEN:-}
      SONARQUBE_PROJECT_KEY: ${SONARQUBE_PROJECT_KEY:-cicd-demo}
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_started
      platformiq-kafka:
        condition: service_healthy
      platformiq-kafka-init:
        condition: service_completed_successfully
    networks:
      - platformiq-net

  sonarqube_db:
    image: postgres:16
    container_name: cicd_sonarqube_db
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar
      POSTGRES_DB: sonarqube
    volumes:
      - sonarqube_db_data:/var/lib/postgresql/data
    networks:
      - platformiq-net

  sonarqube:
    image: sonarqube:lts-community
    container_name: cicd_sonarqube
    depends_on:
      - sonarqube_db
    ports:
      - "9000:9000"
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonarqube_db:5432/sonarqube
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar
      
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    networks:
      - platformiq-net



  prometheus:
    image: prom/prometheus:latest
    container_name: platformiq-prometheus
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - platformiq-net

  grafana:
    image: grafana/grafana:latest
    container_name: platformiq-grafana
    ports:
      - "3002:3000"
    volumes:
      - ./observability/grafana/datasources:/etc/grafana/provisioning/datasources
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    networks:
      - platformiq-net

  loki:
    image: grafana/loki:2.9.8
    container_name: platformiq-loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./observability/loki/loki-config.yml:/etc/loki/loki-config.yml
    networks:
      - platformiq-net

  promtail:
    image: grafana/promtail:2.9.8
    container_name: platformiq-promtail
    volumes:
      - ./observability/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    command: -config.file=/etc/promtail/promtail-config.yml
    networks:
      - platformiq-net

volumes:
  postgres_data:
  sonarqube_db_data:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:

networks:
  platformiq-net:
    external: true
    name: platformiq-net

  kind:
    external: true
    name: kind